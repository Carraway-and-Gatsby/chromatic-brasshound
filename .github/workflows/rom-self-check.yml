name: ROM self-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rom-self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and emulator regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-emulator.txt

      - name: Install headless SDL runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-2.0-0

      - name: Install toolchain and build native ROM
        run: make setup

      - name: Check generated asset sources
        run: git diff --exit-code -- src/assets.c include/assets.h assets/source_art.json assets/ui/title-native.json

      - name: Validate cartridge header and checksums
        run: tools/emulator-venv/bin/python tests/verify_rom.py --output build/rom-validation.json

      - name: Run emulator self-checks
        run: make test

      - name: Summarize results
        if: always()
        run: python3 tools/ci_summary.py

      - name: Upload ROM and debug evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brasshound-self-check-${{ github.sha }}
          path: build/
          retention-days: 14
          if-no-files-found: warn
